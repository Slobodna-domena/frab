<VirtualHost *:80>
    ServerName scriptum.slobodnadomena.hr
    ServerAdmin webmaster@localhost

    DocumentRoot /home/stjepan/frab/public

    <Directory /home/stjepan/frab/public>
        Options -MultiViews
        Require all granted
    </Directory>

    # Precompiled assets (and any other file that already exists under
    # public/) are served by Apache directly; everything else is proxied
    # to the Puma instance managed by the frab systemd service.
    ProxyPass /assets !
    ProxyPass /favicon.ico !
    ProxyPass /robots.txt !
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3020/
    ProxyPassReverse / http://127.0.0.1:3020/

    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog ${APACHE_LOG_DIR}/frab-error.log
    CustomLog ${APACHE_LOG_DIR}/frab-access.log combined
</VirtualHost>
